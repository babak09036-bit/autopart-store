<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>همه محصولات | اتوپارت</title>
  <meta name="description" content="فهرست کامل لوازم جانبی و تجهیزات خودرو با فیلتر دسته‌بندی، برند، قیمت و خودرو.">
  <meta name="theme-color" content="#D71920">
  <link rel="icon" href="assets/images/ui/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/utils.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/favorites.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/sliders.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/pages/listing.js" defer></script>
</head>
<body data-page="products">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" class="container">
    <nav aria-label="مسیر صفحه">
      <ol class="breadcrumb">
        <li><a href="index.html">خانه</a></li>
        <li aria-current="page" id="crumb-current">همه محصولات</li>
      </ol>
    </nav>
    <h1 class="page-title" id="listing-title">همه محصولات</h1>
    <div id="listing-head"></div>

    <div class="listing">
      <aside class="filters" id="filters" aria-label="فیلترهای محصولات">
        <div class="filters__head">
          <h2><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons/icons.svg#i-filter"></use></svg>فیلترها</h2>
          <button type="button" class="filters__reset" data-remove="all">حذف فیلترها</button>
          <button type="button" class="icon-btn filters__close" data-filters-close aria-label="بستن فیلترها"><svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-close"></use></svg></button>
        </div>
        <form id="filter-form" novalidate></form>
      </aside>

      <section class="listing__main" aria-label="نتایج">
        <div class="listing__bar">
          <button type="button" class="btn btn--light btn--sm listing__filter-btn" data-filters-open aria-controls="filters" aria-expanded="false"><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons/icons.svg#i-filter"></use></svg>فیلترها</button>
          <span class="listing__bar-label"><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons/icons.svg#i-sort"></use></svg>مرتب‌سازی:</span>
          <div class="sort-options" id="sort-options" role="group" aria-label="مرتب‌سازی"></div>
          <span class="listing__count" id="result-count" aria-live="polite"></span>
        </div>
        <div class="active-filters" id="active-filters"></div>
        <div class="grid-products" id="results"></div>
        <div class="empty-state empty-state--panel" id="empty" hidden></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
